name: Domain Review Notification

on:
  pull_request:
    types: [opened]

jobs:
  notify-domain-review:
    runs-on: ubuntu-latest

    steps:
      - name: Send Domain Review Notification
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "text":"Domain Review Required"
            }' \
            "${{ secrets.DOMAIN_WEBHOOK_URL }}"
