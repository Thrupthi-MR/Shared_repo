name: Domain Review Notification

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Teams Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"text":"📢 Domain Review Required: A new Pull Request has been created."}' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"
