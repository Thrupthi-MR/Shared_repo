name: PR Email Notification

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: New PR Created - ${{ github.event.pull_request.title }}

          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Hi Team,

            A new Pull Request has been created/updated in the repository.

            Repository: ${{ github.repository }}
            PR Title: ${{ github.event.pull_request.title }}
            PR Number: #${{ github.event.pull_request.number }}
            Created By: ${{ github.event.pull_request.user.login }}

            PR Link:
            ${{ github.event.pull_request.html_url }}

            Kindly review the Pull Request.

            Thanks,
            Thrupthi M R
